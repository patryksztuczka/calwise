name: Infrastructure

# Manual only. Plans or applies infra/ with state in the private R2 bucket
# created by infra/bootstrap. Run `plan` first, then `apply`.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        required: true
        default: plan
        options: [plan, apply]

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.16"
      - name: Init
        run: terraform init -input=false -backend-config="endpoints={s3=\"https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -out=tfplan
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan
