name: Deploy frontend
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - apps/web/**
      - packages/ui/**
      - packages/shared/**
      - apps/api/src/trpc-router.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vite.config.ts
      - playwright.config.ts
      - tests/**
      - tools/**
      - .nvmrc
      - .oxfmtrc.json
      - .oxlintrc.json
      - .github/actions/**
      - .github/workflows/checks.yml
      - .github/workflows/deploy-web.yml
permissions:
  contents: read
concurrency:
  group: deploy-web-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FRONTEND_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
      - run: pnpm --filter @calwise/api exec wrangler pages deploy ../web/dist --project-name calwise --branch master
