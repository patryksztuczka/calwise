name: Deploy Web

# Builds the frontend against the production api and publishes it to Pages.
# Independent of the api workflow; a failed run is the only signal (no rollback).
on:
  push:
    branches: [master]
    paths:
      - apps/web/**
      - apps/api/src/** # the web app consumes the tRPC router type
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/deploy-web.yml
      - .github/workflows/checks.yml

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Build and deploy to Pages
    needs: checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @calwise/web build
        env:
          VITE_API_URL: https://calwise-api.lastlab.win
      - name: Deploy to Pages
        run: pnpm --filter @calwise/web deploy
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null https://calwise.lastlab.win/
