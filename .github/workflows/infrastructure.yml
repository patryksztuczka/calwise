name: Infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or plan and apply
        type: choice
        options: [plan, apply]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: calwise-infrastructure
  cancel-in-progress: false
jobs:
  terraform:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -lockfile=readonly -backend-config="bucket=calwise-terraform-state"
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra plan -out=tfplan
      - if: inputs.operation == 'apply'
        run: terraform -chdir=infra apply tfplan
      - if: inputs.operation == 'apply'
        run: terraform -chdir=infra output
