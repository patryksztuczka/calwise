name: Deploy API

# Called by CI after shared checks pass. Applies pending D1 migrations,
# then deploys the Worker, independently of the frontend deployment.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      BETTER_AUTH_SECRET:
        required: true

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter @calwise/api db:migrate:remote
      - name: Set the session signing secret
        run: printf '%s' "$BETTER_AUTH_SECRET" | pnpm --filter @calwise/api exec wrangler secret put BETTER_AUTH_SECRET
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - name: Deploy Worker
        run: pnpm --filter @calwise/api run deploy
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://calwise-api.lastlab.win/health
