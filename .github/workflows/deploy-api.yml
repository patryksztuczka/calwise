name: Deploy backend
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - apps/api/**
      - packages/database/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vite.config.ts
      - playwright.config.ts
      - tests/**
      - tools/**
      - .nvmrc
      - .oxfmtrc.json
      - .oxlintrc.json
      - .github/actions/**
      - .github/workflows/checks.yml
      - .github/workflows/deploy-api.yml
permissions:
  contents: read
concurrency:
  group: deploy-api-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolve Terraform-managed database
        shell: bash
        run: |
          pnpm --filter @calwise/api exec wrangler d1 list --json > "$RUNNER_TEMP/databases.json"
          D1_DATABASE_ID=$(jq -er '[.[] | select(.name == "calwise")] | if length == 1 then .[0].uuid else error("Expected one calwise database. Run infrastructure setup first.") end' "$RUNNER_TEMP/databases.json")
          export D1_DATABASE_ID
          pnpm cloudflare:config
      - run: pnpm db:migrate:remote
      - run: pnpm --filter @calwise/api deploy
