packages:
  - apps/*
  - packages/*

allowBuilds:
  workerd: true
  esbuild: true
  msgpackr-extract: true

catalog:
  # toolchain
  typescript: ^7.0.2
  vite-plus: ^0.3.0
  # keep in sync with the versions bundled by vite-plus
  vitest: 4.1.11
  oxfmt: 0.64.0
  oxlint: 1.79.0
  "@types/node": ^26.3.0
  # web
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  # api
  hono: ^4.13.5
  "@hono/trpc-server": ^0.4.2
  "@trpc/server": ^11.18.0
  "@trpc/client": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@tanstack/react-query": ^5.102.8
  effect: 4.0.0-rc.112
  "@effect/sql-d1": 4.0.0-rc.112
  "@effect/sql-sqlite-do": 4.0.0-rc.112
  effect-cf: 0.40.0
  wrangler: 4.129.1
  "@cloudflare/workers-types": 5.20260907.1
  "@playwright/test": 1.63.0
  drizzle-orm: 1.0.0-rc.5-169397b
  drizzle-kit: 1.0.0-rc.4

minimumReleaseAgeExclude:
  - hono@4.13.5
  - "@tanstack/query-core@5.102.8"
  - "@tanstack/react-query@5.102.8"
  - "@cloudflare/workerd-darwin-64@1.20260907.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260907.1"
  - "@cloudflare/workerd-linux-64@1.20260907.1"
  - "@cloudflare/workerd-linux-arm64@1.20260907.1"
  - "@cloudflare/workerd-windows-64@1.20260907.1"
  - "@cloudflare/workers-types@5.20260907.1"
  - miniflare@5.20260907.0-alpha
  - workerd@1.20260907.1
  - wrangler@4.129.1
