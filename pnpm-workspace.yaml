packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  # optional native accelerator for effect's msgpackr dependency
  msgpackr-extract: true
  workerd: true

catalog:
  # toolchain
  typescript: ^7.0.2
  vite-plus: ^0.3.0
  # keep in sync with the versions bundled by vite-plus
  vitest: 4.1.11
  oxfmt: 0.64.0
  oxlint: 1.79.0
  "@types/node": ^26.3.0
  "@playwright/test": ^1.63.0
  # cloudflare
  wrangler: ^4.129.0
  "@cloudflare/workers-types": ^5.20260825.1
  # web
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router: ^8.3.1
  lucide-react: ^1.42.0
  zxing-wasm: ^3.1.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  # api
  hono: ^4.13.5
  "@hono/trpc-server": ^0.4.2
  "@trpc/server": ^11.18.0
  "@trpc/client": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@tanstack/react-query": ^5.102.8
  # effect train: keep effect, @effect/*, effect-cf, and drizzle-orm moving together
  effect: 4.0.0-rc.112
  "@effect/sql-d1": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  effect-cf: ^0.40.0
  drizzle-orm: 1.0.0-rc.5-169397b
  drizzle-kit: 1.0.0-rc.4
  # optional drizzle-orm peer that better-auth pulls into the api; declared in the
  # database package too so both workspaces resolve one drizzle-orm instance
  zod: ^4.5.4
  # auth
  better-auth: ^1.7.3

minimumReleaseAgeExclude:
  - hono@4.13.5
  - "@tanstack/query-core@5.102.8"
  - "@tanstack/react-query@5.102.8"
  - react-router@8.3.1
  - lucide-react@1.42.0
