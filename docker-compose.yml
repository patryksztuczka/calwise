services:
  postgres:
    image: postgres:18-alpine
    container_name: calwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: calwise
      POSTGRES_PASSWORD: calwise
      POSTGRES_DB: calwise
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calwise -d calwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
